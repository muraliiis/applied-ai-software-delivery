[defaults]
# Inventory
inventory           = inventory/hosts.yml

# Vault password file — created by setup, gitignored, chmod 600
vault_password_file = /home/a463476/repos/applied-ai-software-delivery/ansible/.vault_pass

# Collections path (local install)
collections_paths   = ~/.ansible/collections

# Roles path
roles_path          = roles

# Logging
log_path            = /tmp/ansible-zos.log

# SSH settings
host_key_checking   = False
timeout             = 60
private_key_file    = ~/.ssh/id_zos

# Retry files
retry_files_enabled = False

# Temp directory for localhost delegate tasks
remote_tmp          = /tmp/.ansible

[ssh_connection]
# Pipelining improves performance on z/OS USS
# Pipelining — disabled for z/OS: binary AnsiballZ modules are piped via stdin
# which corrupts them when _TAG_REDIR_IN=txt triggers EBCDIC auto-conversion.
pipelining          = False
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s
